name: 24/7 Autonomous Speechify Complaint Hunter

on:
  schedule:
    # Runs every single hour, 24/7/365, completely free with UNLIMITED minutes on public repos!
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub anytime

jobs:
  hunt-leads:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit new leads back to repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 8-Agent Swarm Pipeline
        run: |
          python speechify_swarm_engine.py

      - name: Update index.html with Latest Leads & Commit
        run: |
          git config --local user.email "agent@github-actions.bot"
          git config --local user.name "Autonomous Churn Agent"
          git add speechify_leads.json dashboard.html index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-captured new Speechify churn leads [skip ci]" && git push)

